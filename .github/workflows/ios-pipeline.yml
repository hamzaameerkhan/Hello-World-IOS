name: iOS Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest  # Use macOS runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Ruby 3.1.0
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1.0'  # Specify a compatible Ruby version

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install
    
    - name: Build the iOS app
      run: |
        xcodebuild -workspace hello-world-ios.xcworkspace -scheme hello-world-ios -sdk iphonesimulator -configuration Debug
